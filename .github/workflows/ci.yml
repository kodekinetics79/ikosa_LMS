name: build-test-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration

  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/ik-osa.log 2>&1 &
      - run: ./scripts/wait-for-http.sh http://127.0.0.1:3000/api/health 90
      - run: npm run test:e2e -- --project=chromium --grep @critical
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: /tmp/ik-osa.log
          if-no-files-found: ignore
